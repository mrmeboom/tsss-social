<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherry / Content Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:        #0b0a09;
      --surface:   #141210;
      --surface-2: #1c1916;
      --surface-3: #232019;
      --border:    #2c2820;
      --border-2:  #3a342a;
      --gold:      #c07a18;
      --gold-lt:   #d9911f;
      --gold-dim:  #7a4e0e;
      --orange:    #c95c22;
      --text:      #e8dfd0;
      --text-2:    #a89880;
      --text-3:    #5c5248;
      --danger:    #b83030;
      --radius:    7px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 60% 40% at 15% -5%,  rgba(192,122,24,.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 35% at 90% 105%, rgba(201,92,34,.05)  0%, transparent 55%);
    }

    /* ── HEADER ─────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 200;
      background: rgba(11,10,9,.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: .9rem 1.4rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: .01em;
      white-space: nowrap;
    }
    .logo em {
      font-style: normal;
      color: var(--text-3);
      font-family: 'DM Mono', monospace;
      font-size: .7rem;
      font-weight: 300;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-left: .4rem;
    }

    .header-right { display: flex; gap: .6rem; align-items: center; }

    /* ── CONTROLS ────────────────────────────────────── */
    .toolbar {
      padding: .8rem 1.4rem;
      border-bottom: 1px solid var(--border);
      display: flex; gap: .6rem; flex-wrap: wrap; align-items: center;
    }

    .search-wrap { flex: 1; min-width: 160px; max-width: 300px; position: relative; }
    .search-wrap::before {
      content: '⌕';
      position: absolute; left: .6rem; top: 50%; transform: translateY(-50%);
      color: var(--text-3); font-size: 1rem; pointer-events: none;
    }
    .search-wrap input { padding-left: 1.8rem; }

    input[type="text"], input[type="url"], input[type="number"], textarea, select {
      font-family: 'DM Mono', monospace;
      font-size: .78rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: .45rem .7rem;
      width: 100%;
      outline: none;
      transition: border-color .15s, background .15s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--gold);
      background: var(--surface-3);
    }
    input::placeholder, textarea::placeholder { color: var(--text-3); }
    select option { background: var(--surface-2); }

    .cats {
      display: flex; gap: .35rem; flex-wrap: wrap; align-items: center;
    }

    .cat-pill {
      font-family: 'DM Mono', monospace;
      font-size: .62rem;
      font-weight: 500;
      letter-spacing: .07em;
      text-transform: uppercase;
      padding: .28rem .65rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .cat-pill:hover  { border-color: var(--gold-dim); color: var(--text-2); }
    .cat-pill.active { background: var(--gold); border-color: var(--gold); color: #000; }

    /* ── STATS ───────────────────────────────────────── */
    .statsbar {
      padding: .35rem 1.4rem;
      border-bottom: 1px solid var(--border);
      font-size: .62rem;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--text-3);
      display: flex; gap: 1.4rem; flex-wrap: wrap;
    }
    .statsbar b { color: var(--gold); font-weight: 500; }

    /* ── BUTTONS ─────────────────────────────────────── */
    .btn {
      font-family: 'DM Mono', monospace;
      font-size: .75rem;
      font-weight: 500;
      padding: .45rem 1rem;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .btn-gold   { background: var(--gold);  color: #000; border-color: var(--gold); }
    .btn-gold:hover { background: var(--gold-lt); border-color: var(--gold-lt); }
    .btn-ghost  { background: transparent; color: var(--text-2); border-color: var(--border); }
    .btn-ghost:hover { border-color: var(--border-2); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    .btn-danger:hover { background: #d44444; border-color: #d44444; }
    .btn-sm { padding: .3rem .65rem; font-size: .68rem; }

    .btn-icon {
      width: 26px; height: 26px;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-3);
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: .75rem;
      transition: all .15s;
      flex-shrink: 0;
    }
    .btn-icon:hover      { border-color: var(--gold-dim); color: var(--gold); }
    .btn-icon.dng:hover  { border-color: var(--danger); color: var(--danger); }

    /* ── GRID ────────────────────────────────────────── */
    .grid {
      padding: 1.25rem 1.4rem;
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(2, 1fr);
      align-items: start;
    }
    @media (min-width: 640px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 900px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1280px) { .grid { grid-template-columns: repeat(4, 1fr); } }

    /* ── CARD ────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s;
      display: flex; flex-direction: column;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 35px rgba(0,0,0,.5);
      border-color: var(--border-2);
    }

    /* thumb */
    .thumb {
      position: relative;
      aspect-ratio: 16/9;
      background: var(--surface-2);
      overflow: hidden;
      flex-shrink: 0;
    }
    .thumb video {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      background: #000;
    }

    .thumb-empty {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-3); font-size: 1.6rem;
    }

    .num-badge {
      position: absolute; top: 5px; left: 5px;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(6px);
      color: var(--gold);
      font-size: .58rem; font-weight: 500;
      padding: 2px 6px; border-radius: 4px;
    }



    /* info panel */
    .info {
      padding: .65rem .7rem .7rem;
      display: flex; flex-direction: column; gap: .45rem;
      flex: 1;
    }

    .info-top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: .4rem;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: .82rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
      flex: 1;
      word-break: break-word;
    }

    .card-acts { display: flex; gap: .3rem; flex-shrink: 0; }

    .meta { display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; }

    .badge {
      font-size: .57rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 10px;
      border: 1px solid;
      white-space: nowrap;
    }
    .badge-cat    { border-color: var(--orange);  color: var(--orange); }
    .badge-views  { border-color: var(--text-3);  color: var(--text-2); }
    .badge-shots  { border-color: var(--gold-dim); color: var(--gold); }

    /* shots */
    .shots-wrap {
      border-top: 1px solid var(--border);
      padding-top: .45rem;
    }

    .shots-hd {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: .35rem;
    }

    .shots-label {
      font-size: .58rem;
      text-transform: uppercase; letter-spacing: .1em;
      color: var(--text-3);
    }

    .btn-add-shot {
      background: none; border: none;
      color: var(--gold); font-size: .68rem;
      font-family: 'DM Mono', monospace;
      cursor: pointer; padding: 0;
      transition: color .15s;
    }
    .btn-add-shot:hover { color: var(--gold-lt); }

    .shots-list { display: flex; flex-direction: column; gap: .28rem; }

    .shot-row { display: flex; align-items: center; gap: .35rem; }
    .shot-row::before {
      content: '—'; color: var(--text-3); font-size: .65rem; flex-shrink: 0;
    }

    .shot-input {
      flex: 1; font-size: .7rem;
      padding: .22rem .4rem;
      min-width: 0;
    }

    .btn-del-shot {
      background: none; border: none;
      color: var(--text-3); font-size: .7rem;
      cursor: pointer; padding: 0;
      transition: color .15s; flex-shrink: 0;
    }
    .btn-del-shot:hover { color: var(--danger); }

    /* ── EMPTY / LOADING ─────────────────────────────── */
    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-3);
    }
    .state-msg .icon { font-size: 2.2rem; margin-bottom: .5rem; opacity: .4; }
    .state-msg p { font-size: .8rem; color: var(--text-2); margin-top: .3rem; }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid var(--border-2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: .5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── MODAL ───────────────────────────────────────── */
    .overlay {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,.78);
      backdrop-filter: blur(8px);
      align-items: center; justify-content: center;
      padding: 1rem;
    }
    .overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border-2);
      border-radius: 12px;
      width: 100%; max-width: 460px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 24px 70px rgba(0,0,0,.7);
    }

    .modal-hd {
      padding: 1.1rem 1.4rem;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; background: var(--surface); z-index: 1;
    }
    .modal-ttl {
      font-family: 'Playfair Display', serif;
      font-size: 1rem; color: var(--gold);
    }
    .modal-x {
      background: none; border: none;
      color: var(--text-3); font-size: 1.1rem;
      cursor: pointer; line-height: 1;
      transition: color .15s;
    }
    .modal-x:hover { color: var(--text); }

    .modal-body {
      padding: 1.3rem 1.4rem;
      display: flex; flex-direction: column; gap: .9rem;
    }

    .fg label {
      display: block;
      font-size: .62rem;
      text-transform: uppercase; letter-spacing: .09em;
      color: var(--text-3);
      margin-bottom: .35rem;
    }
    .fg-row { display: flex; gap: .6rem; }
    .fg-row .fg { flex: 1; }

    .modal-ft {
      padding: .9rem 1.4rem;
      border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: .6rem;
    }

    /* ── CONFIRM ─────────────────────────────────────── */
    .confirm-box {
      background: var(--surface);
      border: 1px solid var(--border-2);
      border-radius: 12px;
      padding: 1.6rem;
      max-width: 300px; width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.7);
    }
    .confirm-box .c-icon { font-size: 1.8rem; color: var(--danger); margin-bottom: .5rem; }
    .confirm-box h3 {
      font-family: 'Playfair Display', serif;
      font-size: .95rem; color: var(--text);
      margin-bottom: .5rem;
    }
    .confirm-box p { font-size: .75rem; color: var(--text-2); line-height: 1.5; margin-bottom: 1.1rem; }
    .confirm-acts { display: flex; gap: .6rem; justify-content: center; }

    /* ── TOAST ───────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 1.4rem; right: 1.4rem;
      background: var(--surface-3);
      border: 1px solid var(--border-2);
      border-left: 3px solid var(--gold);
      color: var(--text);
      font-size: .75rem;
      padding: .65rem 1rem;
      border-radius: var(--radius);
      z-index: 9999;
      max-width: 260px;
      transform: translateX(130%);
      transition: transform .28s cubic-bezier(.34,1.56,.64,1);
      pointer-events: none;
    }
    .toast.show { transform: translateX(0); }
    .toast.err  { border-left-color: var(--danger); }

    /* ── SCROLLBAR ───────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">Sherry <em>content board</em></div>
  <div class="header-right">
    <button class="btn btn-gold" onclick="openModal()">+ Add Video</button>
  </div>
</header>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search…" oninput="render()">
  </div>
  <div class="cats" id="cats">
    <button class="cat-pill active" data-cat="all" onclick="setCat(this)">All</button>
  </div>
</div>

<!-- STATS -->
<div class="statsbar" id="stats">
  <span>Loading…</span>
</div>

<!-- GRID -->
<div class="grid" id="grid">
  <div class="state-msg"><div class="spinner"></div><p>Loading videos…</p></div>
</div>

<!-- MODAL: Add / Edit -->
<div class="overlay" id="modalOv" onclick="ovClick(event,'modalOv',closeModal)">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-ttl" id="modalTtl">Add Video</span>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="fg-row">
        <div class="fg" style="max-width:90px">
          <label>Number</label>
          <input type="number" id="fNum" placeholder="42">
        </div>
        <div class="fg">
          <label>Title *</label>
          <input type="text" id="fTitle" placeholder="Video title">
        </div>
      </div>
      <div class="fg">
        <label>Cloudinary URL *</label>
        <input type="url" id="fUrl" placeholder="https://res.cloudinary.com/…">
      </div>
      <div class="fg-row">
        <div class="fg">
          <label>Category</label>
          <select id="fCat">
            <option value="">— none —</option>
            <option>Thuis</option>
            <option>Feria</option>
            <option>Tussendoor</option>
            <option>Veel werk</option>
            <option>Tsja</option>
            <option>Klaar</option>
          </select>
        </div>
        <div class="fg" style="max-width:120px">
          <label>Views</label>
          <input type="text" id="fViews" placeholder="1.2K">
        </div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" onclick="saveVideo()">Save</button>
    </div>
  </div>
</div>

<!-- MODAL: Confirm delete -->
<div class="overlay" id="confirmOv" onclick="ovClick(event,'confirmOv',closeConfirm)">
  <div class="confirm-box">
    <div class="c-icon">⚠</div>
    <h3>Delete Video</h3>
    <p>This will also remove all its shots. Are you sure?</p>
    <div class="confirm-acts">
      <button class="btn btn-ghost btn-sm" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger btn-sm" id="confirmBtn">Delete</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─── Supabase ─────────────────────────────────────────
const { createClient } = supabase;
const sb = createClient(
  'https://gyavdaefgzmsuvtufzfr.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5YXZkYWVmZ3ptc3V2dHVmemZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMzIzNTEsImV4cCI6MjA5MzkwODM1MX0.WNwYckpRgUVMNCsGiZQrkES6Eg6x-aoi83-RMb0jeAI'
);

// ─── State ────────────────────────────────────────────
let videos = [];
let activeCat = 'all';

// ─── Utils ────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}



function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3200);
}

function ovClick(e, id, fn) {
  if (e.target === document.getElementById(id)) fn();
}

// ─── Load ─────────────────────────────────────────────
async function loadAll() {
  const res = await sb.from('videos').select('*').order('num', { ascending: true, nullsLast: true });
  if (res.error) { toast('Load failed: ' + res.error.message, true); grid('err'); return; }
  videos = res.data || [];
  buildCats();
  render();
}

// ─── Category bar ─────────────────────────────────────
const CAT_ORDER = ['Thuis','Feria','Tussendoor','Veel werk','Tsja','Klaar'];

function buildCats() {
  const el = document.getElementById('cats');
  const counts = {};
  videos.forEach(v => { if (v.category) counts[v.category] = (counts[v.category] || 0) + 1; });
  let html = `<button class="cat-pill${activeCat==='all'?' active':''}" data-cat="all" onclick="setCat(this)">All <span style="opacity:.6">${videos.length}</span></button>`;
  CAT_ORDER.forEach(c => {
    if (!counts[c]) return;
    html += `<button class="cat-pill${activeCat===c?' active':''}" data-cat="${c}" onclick="setCat(this)">${c} <span style="opacity:.6">${counts[c]}</span></button>`;
  });
  el.innerHTML = html;
}

function setCat(btn) {
  activeCat = btn.dataset.cat;
  document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ─── Render ───────────────────────────────────────────
function grid(state) {
  const g = document.getElementById('grid');
  if (state === 'loading') { g.innerHTML = `<div class="state-msg"><div class="spinner"></div><p>Loading…</p></div>`; return; }
  if (state === 'err')     { g.innerHTML = `<div class="state-msg"><div class="icon">✖</div><p>Could not connect to database.</p></div>`; return; }
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const filtered = videos.filter(v => {
    const ms = !q || (v.title||'').toLowerCase().includes(q) || String(v.num||'').includes(q);
    const mc = activeCat === 'all' || v.category === activeCat;
    return ms && mc;
  });

  const totalShots = videos.reduce((a, v) => a + (v.shots?.length || 0), 0);
  const catSet = new Set(videos.map(v => v.category).filter(Boolean));
  document.getElementById('stats').innerHTML =
    `Videos <b>${filtered.length}</b> of <b>${videos.length}</b> &nbsp;·&nbsp; Shots <b>${totalShots}</b> &nbsp;·&nbsp; Categories <b>${catSet.size}</b>`;

  const g = document.getElementById('grid');
  if (!filtered.length) {
    g.innerHTML = `<div class="state-msg"><div class="icon">▣</div><p>${
      videos.length ? 'No videos match your filter.' : 'No videos yet — add your first one.'
    }</p></div>`;
    return;
  }
  g.innerHTML = filtered.map(cardHTML).join('');
}

// ─── Card ─────────────────────────────────────────────
function cardHTML(v) {
  const list = v.shots || [];
  const shotCount = list.length;

  return `
  <div class="card" id="card-${v.id}">
    <div class="thumb">
      ${v.num != null ? `<div class="num-badge">#${v.num}</div>` : ''}
      ${v.url
        ? `<video src="${esc(v.url)}" controls preload="metadata" playsinline></video>`
        : `<div class="thumb-empty">▣</div>`}
    </div>
    <div class="info">
      <div class="info-top">
        <div class="card-title">${esc(v.title || 'Untitled')}</div>
        <div class="card-acts">
          <button class="btn-icon" onclick="openModal(${v.id})" title="Edit">✎</button>
          <button class="btn-icon dng" onclick="confirmDel(${v.id})" title="Delete">✕</button>
        </div>
      </div>
      <div class="meta">
        ${v.category ? `<span class="badge badge-cat">${esc(v.category)}</span>` : ''}
        ${v.views    ? `<span class="badge badge-views">👁 ${esc(v.views)}</span>` : ''}
        <span class="badge badge-shots" id="sc-${v.id}">⚡ ${shotCount}</span>
      </div>
      <div class="shots-wrap">
        <div class="shots-hd">
          <span class="shots-label">Shots</span>
          <button class="btn-add-shot" onclick="addShot(${v.id})">+ add</button>
        </div>
        <div class="shots-list" id="sl-${v.id}">
          ${list.map((s, i) => shotRowHTML(v.id, s, i)).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function shotRowHTML(vid, val, idx) {
  return `
  <div class="shot-row">
    <input class="shot-input" type="text" value="${esc(val)}"
      onblur="saveShot(${vid},${idx},this.value)"
      onkeydown="if(event.key==='Enter')this.blur()">
    <button class="btn-del-shot" onclick="delShot(${vid},${idx})">✕</button>
  </div>`;
}

// ─── Shot ops ─────────────────────────────────────────
async function addShot(vid) {
  const v = videos.find(x => x.id === vid);
  const list = [...(v.shots || []), ''];
  await writeShots(vid, list);
  const sl = document.getElementById(`sl-${vid}`);
  if (sl) sl.querySelector('.shot-row:last-child input')?.focus();
}

async function delShot(vid, idx) {
  const v = videos.find(x => x.id === vid);
  const list = [...(v.shots || [])];
  list.splice(idx, 1);
  await writeShots(vid, list);
}

async function saveShot(vid, idx, val) {
  const v = videos.find(x => x.id === vid);
  const list = [...(v.shots || [])];
  if (list[idx] === val) return;
  list[idx] = val;
  await writeShots(vid, list);
}

async function writeShots(vid, list) {
  const res = await sb.from('videos').update({ shots: list }).eq('id', vid).select().single();
  if (res.error) { toast('Save failed: ' + res.error.message, true); return; }
  videos = videos.map(v => v.id === vid ? res.data : v);
  const sl = document.getElementById(`sl-${vid}`);
  if (sl) sl.innerHTML = list.map((s, i) => shotRowHTML(vid, s, i)).join('');
  const sc = document.getElementById(`sc-${vid}`);
  if (sc) sc.textContent = `⚡ ${list.length}`;
}

// ─── Video CRUD ───────────────────────────────────────
let editId = null;

function openModal(id) {
  editId = id || null;
  document.getElementById('modalTtl').textContent = id ? 'Edit Video' : 'Add Video';
  const v = id ? videos.find(x => x.id === id) : null;
  document.getElementById('fNum').value   = v?.num   ?? '';
  document.getElementById('fTitle').value = v?.title ?? '';
  document.getElementById('fUrl').value   = v?.url   ?? '';
  document.getElementById('fCat').value   = v?.category ?? '';
  document.getElementById('fViews').value = v?.views ?? '';
  document.getElementById('modalOv').classList.add('open');
  setTimeout(() => document.getElementById('fTitle').focus(), 80);
}

function closeModal() {
  document.getElementById('modalOv').classList.remove('open');
  editId = null;
}

async function saveVideo() {
  const title = document.getElementById('fTitle').value.trim();
  const url   = document.getElementById('fUrl').value.trim();
  if (!title) { toast('Title is required', true); return; }
  if (!url)   { toast('URL is required', true); return; }

  const numVal = document.getElementById('fNum').value.trim();
  const payload = {
    title,
    url,
    category: document.getElementById('fCat').value || null,
    views:    document.getElementById('fViews').value.trim() || null,
    num:      numVal !== '' ? parseInt(numVal) : null,
    updated_at: new Date().toISOString()
  };

  let res;
  if (editId) {
    res = await sb.from('videos').update(payload).eq('id', editId).select().single();
  } else {
    res = await sb.from('videos').insert(payload).select().single();
  }
  if (res.error) { toast('Save failed: ' + res.error.message, true); return; }

  if (editId) {
    videos = videos.map(v => v.id === editId ? res.data : v);
    toast('Video updated ✓');
  } else {
    videos.push(res.data);
    toast('Video added ✓');
  }

  closeModal();
  buildCats();
  render();
}

// ─── Delete ───────────────────────────────────────────
let pendingDel = null;

function confirmDel(id) {
  pendingDel = id;
  document.getElementById('confirmOv').classList.add('open');
  document.getElementById('confirmBtn').onclick = doDelete;
}

function closeConfirm() {
  document.getElementById('confirmOv').classList.remove('open');
  pendingDel = null;
}

async function doDelete() {
  if (!pendingDel) return;
  closeConfirm();
  const res = await sb.from('videos').delete().eq('id', pendingDel);
  if (res.error) { toast('Delete failed: ' + res.error.message, true); return; }
  videos = videos.filter(v => v.id !== pendingDel);
  delete shots[pendingDel];
  toast('Deleted');
  buildCats();
  render();
}

// ─── Keyboard ─────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeConfirm(); }
});

// ─── Boot ─────────────────────────────────────────────
loadAll();
</script>
</body>
