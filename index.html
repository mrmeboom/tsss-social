<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherry Content Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0f0d0b;
      --bg2:       #1a1713;
      --bg3:       #242018;
      --border:    #2e2820;
      --amber:     #c8841a;
      --amber-l:   #e8a030;
      --amber-dim: rgba(200,132,26,0.13);
      --text:      #e8ddd0;
      --text-dim:  #8a7d6e;
      --text-muted:#4a4035;
      --green-bg:  rgba(80,140,60,0.12);
      --green:     #6aaa52;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      padding: 1rem;
    }

    /* ── Header ── */
    header {
      padding: 1rem 1rem 0.85rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 50;
    }

    .header-left { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }

    header h1 {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 1.45rem;
      color: var(--amber-l);
      letter-spacing: -0.01em;
    }

    .video-count {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .add-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .header-right {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .auth-btn {
      background: var(--bg2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .auth-btn:hover {
      background: var(--accent);
      color: white;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
      padding: 1rem;
      justify-content: start;
      max-width: 1400px;
      margin: 0 auto;
      background: transparent;
    }

    /* Mobile responsive grid */
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 0.75rem;
        padding: 0.75rem;
      }
      .card {
        max-width: none !important;
        width: 100% !important;
      }
    }

    @media (max-width: 480px) {
      .grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 0.5rem;
        padding: 0.5rem;
      }
      .card {
        max-width: none !important;
        width: 100% !important;
      }
    }

    /* ── Card ── */
    .card {
      background: var(--bg2);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      max-width: 300px;
      width: 100%;
      border: 2px solid var(--border);
      position: relative;
    }
    .card:hover {
      transform: translateY(-2px);
    }

    .card-embed {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: var(--bg2);
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .card-embed video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.3) 100%);
      opacity: 1;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .card-embed:hover .video-overlay {
      opacity: 0;
    }

    .play-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--bg);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .card-embed:hover .play-indicator {
      opacity: 1;
    }

    /* ── Card body ── */
    .card-body {
      padding: 0.55rem 0.6rem 0.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .meta-row {
      display: flex;
      align-items: flex-start;
      gap: 0.3rem;
    }

    .num-badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      color: var(--amber);
      background: var(--amber-dim);
      padding: 0.15rem 0.3rem;
      border-radius: 2px;
      flex-shrink: 0;
      margin-top: 2px;
      letter-spacing: 0.03em;
    }

    .card-title {
      font-family: 'Instrument Serif', serif;
      font-size: 0.82rem;
      line-height: 1.3;
      color: var(--text);
      flex: 1;
      min-width: 0;
    }

    .views-badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.52rem;
      color: var(--green);
      background: var(--green-bg);
      padding: 0.15rem 0.3rem;
      border-radius: 2px;
      flex-shrink: 0;
      margin-top: 2px;
      letter-spacing: 0.02em;
    }

    .edit-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.72rem;
      padding: 0.1rem 0.15rem;
      flex-shrink: 0;
      line-height: 1;
      transition: color 0.15s;
    }
    .edit-btn:hover { color: var(--amber); }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.72rem;
      padding: 0.1rem 0.15rem;
      flex-shrink: 0;
      line-height: 1;
      transition: color 0.15s;
    }
    .delete-btn:hover { color: var(--red); }

    .card-controls {
      position: absolute;
      bottom: 0.5rem;
      right: 0.5rem;
      display: flex;
      gap: 0.25rem;
      z-index: 10;
    }

    .category-dropdown {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 0.7rem;
      padding: 0.2rem;
      cursor: pointer;
      z-index: 10;
    }

    /* ── Shots display ── */
    .shots-area { display: flex; flex-direction: column; gap: 0.22rem; }

    .shots-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.57rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .shots-label em {
      color: var(--amber-l);
      font-style: normal;
    }

    .add-shot-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.5rem;
      padding: 0.1rem 0.3rem;
      border-radius: 2px;
      transition: all 0.15s;
      margin-left: auto;
    }
    .add-shot-btn:hover {
      border-color: var(--amber);
      color: var(--amber);
    }

    .shots-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .shot-item {
      font-size: 0.68rem;
      color: var(--text-dim);
      line-height: 1.35;
      display: grid;
      grid-template-columns: 10px 1fr auto;
      gap: 0.25rem;
      align-items: center;
    }

    .shot-item::before {
      content: '—';
      color: var(--text-muted);
    }

    .shot-item input {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: inherit;
      padding: 0.1rem;
      border-radius: 2px;
      width: 100%;
    }
    .shot-item input:focus {
      outline: none;
      border-color: var(--amber);
      background: var(--bg3);
    }

    .shot-item button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.6rem;
      padding: 0.1rem;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .shot-item:hover button {
      opacity: 1;
    }
    .shot-item button:hover {
      color: #c05040;
    }

    .no-shots {
      font-size: 0.63rem;
      color: var(--text-muted);
      font-style: italic;
      font-family: 'Instrument Serif', serif;
    }

    /* ── Edit panel ── */
    .edit-panel {
      display: none;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 0.65rem 0.7rem 0.7rem;
    }
    .edit-panel.open { display: block; }

    .field-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.57rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      display: block;
      margin-bottom: 0.28rem;
    }

    .field-group { margin-bottom: 0.55rem; }

    .edit-panel input[type="number"] {
      width: 58px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      padding: 0.28rem 0.4rem;
      border-radius: 3px;
    }

    .edit-panel textarea {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.68rem;
      font-family: 'DM Sans', sans-serif;
      line-height: 1.5;
      padding: 0.38rem 0.45rem;
      border-radius: 3px;
      resize: vertical;
      min-height: 68px;
    }

    .edit-panel input:focus,
    .edit-panel textarea:focus {
      outline: 1px solid var(--amber);
      border-color: var(--amber);
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }

    .btn-save {
      background: var(--amber);
      border: none;
      color: #0f0d0b;
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 500;
      padding: 0.32rem 0.7rem;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-save:hover { background: var(--amber-l); }

    .btn-cancel {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.32rem 0.7rem;
      border-radius: 3px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .btn-cancel:hover { border-color: var(--text-dim); }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0.1rem 0.2rem;
      margin-left: auto;
      transition: color 0.15s;
    }
    .btn-delete:hover { color: #c05040; }

    /* ── Add modal ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .overlay.open { display: flex; }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.2rem;
      width: 100%;
      max-width: 380px;
    }

    .modal h2 {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--amber-l);
      margin-bottom: 0.9rem;
    }

    .modal .field-group { margin-bottom: 0.6rem; }

    .modal input, .modal textarea {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.78rem;
      font-family: 'DM Sans', sans-serif;
      padding: 0.38rem 0.5rem;
      border-radius: 3px;
    }
    .modal input:focus, .modal textarea:focus {
      outline: 1px solid var(--amber);
      border-color: var(--amber);
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 1rem;
        padding: 0.5rem;
      }
      body {
        padding: 0.5rem;
      }
    }
    
    /* ── Sections ── */
    .section {
      margin-bottom: 2rem;
    }
    
    .section-title {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--amber-l);
      margin-bottom: 1rem;
      padding: 0 1rem;
    }
    
    .section-title em {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-style: normal;
      margin-left: 0.5rem;
    }
  </style>
</head>

// ── State ──
async function loadState() {
  try {
    const { data: videos, error } = await supabase
      .from('videos')
      .select('*')
      .order('num', { ascending: true });
    
    if (error) throw error;
    
    // Load shots for each video
    const shots = {};
    for (const video of videos) {
      const { data: shotData, error: shotError } = await supabase
        .from('shots')
        .select('*')
        .eq('video_id', video.id)
        .single();
      
      if (!shotError && shotData) {
        shots[video.id] = shotData;
      }
    }
    
    return { videos, shots };
  } catch(e) {
    // Fallback to SEED for development
    return { videos: SEED, shots: {} };
  }
}

  state = await loadState();

}

    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')

}

  // Return mapped URL for original videos
  if (videoMap[videoId]) {
    return videoMap[videoId];
  }
  
  // For new videos (ID > 20), use the URL field from the video data
  const video = state.videos.find(v => v.id === videoId);
  if (video && video.url) {
    return video.url;
  }
  
  return null;
}

// ── Render ──
function render() {
  // Update counts
  document.getElementById('video-count').textContent = state.videos.length + ' videos';
  
  // Clear category sections
  document.getElementById('category-sections').innerHTML = '';
  
  // Render uncategorized videos first
  const uncategorizedVideos = state.videos.filter(v => !v.category);
  if (uncategorizedVideos.length > 0) {
    renderCategorySection('No Category', uncategorizedVideos);
  }
  
  // Render category sections
  CATEGORIES.forEach(category => {
    const categoryVideos = state.videos.filter(v => v.category === category);
    if (categoryVideos.length > 0) {
      renderCategorySection(category, categoryVideos);
    }
  });
}

function renderCategorySection(category, videos) {
  const sectionDiv = document.createElement('div');
  sectionDiv.className = 'section';
  sectionDiv.innerHTML = `
    <h2 class="section-title">${category} <em>${videos.length}</em></h2>
    <div class="grid" id="category-${category}"></div>
  `;
  
  document.getElementById('category-sections').appendChild(sectionDiv);
  
  videos.forEach(v => {
    renderVideoCard(v, `category-${category}`);
  });
}

function renderVideoCard(v, gridId) {
  const s = state.shots[v.id] || { count: 0, list: [] };

  const shotsHtml = s.list.length
    ? s.list.map((t, i) => `<li class="shot-item"><input type="text" value="${esc(t)}" onchange="updateShot(${v.id}, ${i}, this.value)" placeholder="Shot description"><button onclick="removeShot(${v.id}, ${i})" title="Remove">×</button></li>`).join('')
    : `<span class="no-shots">No shots yet</span>`;

  const videoFile = getVideoFile(v.id);
  const videoHtml = videoFile ? `
    <div class="card-embed" onclick="toggleVideo(${v.id})">
      <video id="video-${v.id}" preload="metadata" playsinline>
        <source src="${videoFile}" type="video/mp4">
      </video>
      <div class="video-overlay"></div>
      <div class="play-indicator">▶</div>
    </div>
  ` : `
    <div class="card-embed">
      <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 0.8rem;">
        No video file
      </div>
    </div>
  `;

  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + v.id;

  const categoryOptions = CATEGORIES.map(cat => 
    '<option value="' + cat + '"' + (v.category === cat ? ' selected' : '') + '>' + cat + '</option>'
  ).join('');

  card.innerHTML = 
    videoHtml +
    '<div class="card-body">' +
      '<div class="meta-row">' +
        '<span class="num-badge">#' + v.num + '</span>' +
        '<span class="card-title">' + esc(v.title) + '</span>' +
        (v.views ? '<span class="views-badge">' + esc(v.views) + '</span>' : '') +
      '</div>' +
      '<div class="shots-area">' +
        '<span class="shots-label">shots: <em>' + s.count + '</em><button class="add-shot-btn" onclick="addShot(' + v.id + ')">+ Add</button></span>' +
        '<ul class="shots-list">' + shotsHtml + '</ul>' +
      '</div>' +
    '</div>' +
    '<select class="category-dropdown" onchange="setCategory(' + v.id + ', this.value)">' +
      '<option value="">No category</option>' +
      categoryOptions +
    '</select>' +
    '<div class="card-controls">' +
      '<button class="edit-btn" onclick="editVideo(' + v.id + ')" title="Edit video">✏️</button>' +
      '<button class="delete-btn" onclick="deleteVideo(' + v.id + ')" title="Delete video">🗑️</button>' +
    '</div>' +
    '<div class="edit-panel" id="ep-' + v.id + '">' +
      '<div class="field-group">' +
        '<label class="field-label">Number of shots</label>' +
        '<input type="number" id="ec-' + v.id + '" value="' + s.count + '" min="0">' +
      '</div>' +
      '<div class="field-group">' +
        '<label class="field-label">Shot descriptions — one per line</label>' +
        '<textarea id="el-' + v.id + '" placeholder="Shot 1&#10;Shot 2&#10;...">' + esc(s.list.join('\n')) + '</textarea>' +
      '</div>' +
      '<div class="btn-row">' +
        '<button class="btn-save"   onclick="saveShots(' + v.id + ')">Save</button>' +
        '<button class="btn-cancel" onclick="toggleEdit(' + v.id + ')">Cancel</button>' +
        '<button class="btn-delete" onclick="deleteVideo(' + v.id + ')" title="Delete">🗑</button>' +
      '</div>' +
    '</div>';

  document.getElementById(gridId).appendChild(card);
}

// ── Actions ──
function setCategory(videoId, category) {
  const video = state.videos.find(v => v.id === videoId);
  if (video) {
    // Set new category
    video.category = category === '' ? null : category;
    save();
    render();
  }
}

function editVideo(videoId) {
  const video = state.videos.find(v => v.id === videoId);
  if (video) {
    // Store current video ID for save function
    window.currentEditId = videoId;
    
    // Get the actual Cloudinary URL that the video uses
    const actualUrl = getVideoFile(videoId);
    
    // Populate modal with existing data
    document.getElementById('m-title').value = video.title || '';
    document.getElementById('m-views').value = video.views || '';
    document.getElementById('m-url').value = actualUrl || '';
    document.getElementById('m-desc').value = video.desc || '';
    
    // Change modal title
    document.querySelector('#overlay h2').textContent = 'Edit video';
    
    // Modify the save button directly using ID
    const saveButton = document.getElementById('modal-save-btn');
    if (saveButton) {
      saveButton.textContent = 'Save changes';
      saveButton.style.backgroundColor = '#28a745';
      saveButton.setAttribute('onclick', 'saveVideoChanges()');
    }
    
    // Open modal
    document.getElementById('overlay').style.display = 'flex';
  }
}

async function saveVideoChanges() {
  const videoId = window.currentEditId;
  
  try {
    // Get current user
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) throw new Error('Please login to edit videos');
    
    // Update video data
    const { error } = await supabase
      .from('videos')
      .update({
        title: document.getElementById('m-title').value,
        views: document.getElementById('m-views').value,
        description: document.getElementById('m-desc').value
      })
      .eq('id', videoId)
      .eq('user_id', user.id); // Ensure user owns the video
    
    if (error) throw error;
    
    // Reload state and re-render
    await loadStateAndRender();
    resetModal();
    closeModal();
  } catch (error) {
    alert('Error updating video: ' + error.message);
  }
}

function resetModal() {
  // Reset modal to add mode
  const modalTitle = document.querySelector('#overlay h2');
  const saveButton = document.getElementById('modal-save-btn');
  
  if (modalTitle) modalTitle.textContent = 'Add video';
  if (saveButton) {
    saveButton.textContent = 'Add';
    saveButton.style.backgroundColor = '';
    saveButton.setAttribute('onclick', 'addVideo()');
  }
  
  // Clear form fields
  document.getElementById('m-title').value = '';
  document.getElementById('m-views').value = '';
  document.getElementById('m-url').value = '';
  document.getElementById('m-desc').value = '';
  
  // Clear edit ID
  window.currentEditId = null;
}


async function deleteVideo(videoId) {
  if (confirm('Are you sure you want to delete this video?')) {
    try {
      // Get current user
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) throw new Error('Please login to delete videos');
      
      // Delete video from Supabase (RLS will ensure user owns it)
      const { error: videoError } = await supabase
        .from('videos')
        .delete()
        .eq('id', videoId)
        .eq('user_id', user.id);
      
      if (videoError) throw videoError;
      
      // Delete associated shots
      await supabase
        .from('shots')
        .delete()
        .eq('video_id', videoId)
        .eq('user_id', user.id);
      
      // Reload state and re-render
      await loadStateAndRender();
    } catch (error) {
      alert('Error deleting video: ' + error.message);
    }
  }
}

function toggleVideo(videoId) {
  const video = document.getElementById(`video-${videoId}`);
  const playIndicator = document.querySelector(`#card-${videoId} .play-indicator`);
  
  if (video) {
    if (video.paused) {
      // Reset to start before playing
      video.currentTime = 0;
      video.load(); // Force reload to clear cache
      video.play().then(() => {
        playIndicator.style.opacity = '0';
      }).catch(e => console.log('Play failed:', e));
    } else {
      video.pause();
      video.currentTime = 0;
      playIndicator.style.opacity = '1';
    }
  }
}

function addShot(videoId) {
  if (!state.shots[videoId]) {
    state.shots[videoId] = { count: 0, list: [] };
  }
  state.shots[videoId].list.push('');
  state.shots[videoId].count = state.shots[videoId].list.length;
  save();
  render();
}

function updateShot(videoId, index, value) {
  if (!state.shots[videoId]) return;
  state.shots[videoId].list[index] = value;
  state.shots[videoId].count = state.shots[videoId].list.filter(s => s.trim()).length;
  save();
  render();
}

function removeShot(videoId, index) {
  if (!state.shots[videoId]) return;
  state.shots[videoId].list.splice(index, 1);
  state.shots[videoId].count = state.shots[videoId].list.filter(s => s.trim()).length;
  save();
  render();
}

function toggleEdit(id) {
  // Legacy function - no longer needed with inline editing
}

function saveShots(id) {
  // Legacy function - no longer needed with inline editing
}

function deleteVideo(id) {
  if (!confirm('Delete this video?')) return;
  state.videos = state.videos.filter(v => v.id !== id);
  delete state.shots[id];
  save();
  render();
}

// ── Modal ──
function openModal()  { document.getElementById('overlay').style.display = 'flex'; }
function closeModal() {
  document.getElementById('overlay').style.display = 'none';
  resetModal();
}

async function addVideo() {
  const title = document.getElementById('m-title').value.trim();
  const views = document.getElementById('m-views').value.trim();
  const url   = document.getElementById('m-url').value.trim();
  const desc  = document.getElementById('m-desc').value.trim();
  if (!title || !url) { alert('Title and URL are required.'); return; }
  
  try {
    // Get current user
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) throw new Error('Please login to add videos');
    
    const maxNum = state.videos.length ? Math.max(...state.videos.map(v => v.num)) : 0;
    const videoData = { 
      num: maxNum + 1, 
      title, 
      views, 
      url, 
      description: desc, 
      category: null,
      user_id: user.id 
    };
    
    // Insert video
    const { data: video, error } = await supabase
      .from('videos')
      .insert(videoData)
      .select()
      .single();
    
    if (error) throw error;
    
    // Add initial shot if description provided
    if (desc) {
      await supabase
        .from('shots')
        .insert({
          video_id: video.id,
          count: 1,
          list: [desc],
          user_id: user.id
        });
    }
    
    // Reload state and re-render
    await loadStateAndRender();
    resetModal();
    closeModal();
  } catch (error) {
    alert('Error adding video: ' + error.message);
  }
}

// ── Authentication ──
async function toggleAuth() {
  const authBtn = document.getElementById('auth-btn');
  
  // Check if supabase is initialized
  if (!supabase) {
    alert('Supabase not initialized yet. Please wait...');
    return;
  }
  
  const { data: { user } } = await supabase.auth.getUser();
  
  if (user) {
    // Logout
    await supabase.auth.signOut();
    authBtn.textContent = 'Login';
    state = await loadState();
  } else {
    // Show login modal
    const email = prompt('Enter your email:');
    const password = prompt('Enter your password:');
    
    if (email && password) {
      const { error } = await supabase.auth.signInWithPassword(email, password);
      if (error) {
        alert('Login failed: ' + error.message);
      } else {
        authBtn.textContent = 'Logout';
        await loadStateAndRender();
      }
    }
  }
}

// close modal on overlay click
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// Initialize app
async function init() {
  initSupabase();
  await initState();
  render();
}

// Start app
init();
</script>
