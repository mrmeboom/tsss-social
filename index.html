<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherry Content Board</title>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    window.createClient = createClient;
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --secondary: #64748b;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #f59e0b;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #94a3b8;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--gray-200);
    }

    .header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--gray-900);
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .video-count {
      color: var(--gray-600);
      font-size: 0.875rem;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .category-pill {
      padding: 0.25rem 0.75rem;
      background: var(--gray-100);
      border: 1px solid var(--gray-200);
      border-radius: 9999px;
      font-size: 0.75rem;
      color: var(--gray-700);
      cursor: pointer;
      transition: all 0.2s;
    }

    .category-pill:hover {
      background: var(--gray-200);
    }

    .category-pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .grid {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: 1fr;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 1280px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .card {
      background: white;
      border-radius: 1rem;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: all 0.3s;
      border: 1px solid var(--gray-200);
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      background: var(--gray-100);
      overflow: hidden;
    }

    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 1rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--gray-900);
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    .card-views {
      font-size: 0.875rem;
      color: var(--gray-600);
      margin-bottom: 1rem;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .btn-small {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
    }

    .btn-edit {
      background: var(--gray-100);
      color: var(--gray-700);
      border: 1px solid var(--gray-200);
    }

    .btn-edit:hover {
      background: var(--gray-200);
    }

    .btn-delete {
      background: var(--danger);
      color: white;
    }

    .btn-delete:hover {
      background: #b91c1c;
    }

    .shots-section {
      border-top: 1px solid var(--gray-200);
      padding-top: 1rem;
    }

    .shots-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .shots-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--gray-700);
    }

    .shots-count {
      background: var(--gray-100);
      padding: 0.125rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      color: var(--gray-600);
    }

    .shots-list {
      list-style: none;
      margin-bottom: 1rem;
    }

    .shot-item {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      align-items: center;
    }

    .shot-input {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--gray-200);
      border-radius: 0.375rem;
      font-size: 0.875rem;
      transition: border-color 0.2s;
    }

    .shot-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn-remove {
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 0.375rem;
      width: 1.5rem;
      height: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-remove:hover {
      background: #b91c1c;
    }

    .btn-add-shot {
      width: 100%;
      padding: 0.5rem;
      background: var(--gray-100);
      border: 1px dashed var(--gray-300);
      border-radius: 0.375rem;
      color: var(--gray-600);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.875rem;
    }

    .btn-add-shot:hover {
      background: var(--gray-200);
      border-color: var(--gray-400);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: white;
      border-radius: 1rem;
      box-shadow: var(--shadow-lg);
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.9);
      transition: transform 0.3s;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-header {
      padding: 1.5rem 1.5rem 0;
      border-bottom: 1px solid var(--gray-200);
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--gray-900);
    }

    .modal-body {
      padding: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--gray-700);
    }

    .form-input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--gray-200);
      border-radius: 0.5rem;
      font-size: 0.875rem;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .modal-footer {
      padding: 1rem 1.5rem 1.5rem;
      border-top: 1px solid var(--gray-200);
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: var(--gray-600);
    }

    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 1rem;
      border-radius: 0.5rem;
      margin: 1rem 0;
    }

    @media (max-width: 640px) {
      .container {
        padding: 1rem 0.5rem;
      }
      
      .header {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
      
      .modal {
        width: 95%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Sherry Content Board</h1>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="app.openModal()">
          <span>+</span> Add Video
        </button>
        <span class="video-count" id="videoCount">0 videos</span>
      </div>
    </header>

    <div class="categories" id="categories">
      <button class="category-pill active" data-category="all">All</button>
    </div>

    <main>
      <div class="loading" id="loading" style="display: none;">
        Loading videos...
      </div>
      
      <div class="error" id="error" style="display: none;">
        Error loading videos. Please refresh the page.
      </div>
      
      <div class="grid" id="videoGrid">
        <!-- Videos will be rendered here -->
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add Video</h2>
      </div>
      <div class="modal-body">
        <form id="videoForm">
          <div class="form-group">
            <label class="form-label" for="title">Title *</label>
            <input type="text" id="title" class="form-input" placeholder="Enter video title" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="views">Views</label>
            <input type="text" id="views" class="form-input" placeholder="e.g., 10K, 100K">
          </div>
          
          <div class="form-group">
            <label class="form-label" for="url">Video URL *</label>
            <input type="url" id="url" class="form-input" placeholder="https://..." required>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="category">Category</label>
            <select id="category" class="form-input">
              <option value="">No category</option>
              <option value="Thuis">Thuis</option>
              <option value="Feria">Feria</option>
              <option value="Tussendoor">Tussendoor</option>
              <option value="Veel werk">Veel werk</option>
              <option value="Tsja">Tsja</option>
              <option value="Klaar">Klaar</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="saveBtn">Save</button>
        <button type="button" class="btn" onclick="app.closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Supabase configuration
    const SUPABASE_URL = 'https://gyavdaefgzmsuvtufzfr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5YXZkYWVmZ3ptc3V2dHVmemZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMzIzNTEsImV4cCI6MjA5MzkwODM1MX0.WNwYckpRgUVMNCsGiZQrkES6Eg6x-aoi83-RMb0jeAI';

    // Application state
    class AppState {
      constructor() {
        this.videos = [];
        this.shots = {};
        this.categories = ['Thuis', 'Feria', 'Tussendoor', 'Veel werk', 'Tsja', 'Klaar'];
        this.currentFilter = 'all';
        this.currentEditId = null;
        this.loading = false;
        this.error = null;
      }

      async initialize() {
        if (!window.createClient) {
          throw new Error('Supabase client not available');
        }

        this.supabase = window.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        await this.loadState();
        this.render();
      }

      async loadState() {
        try {
          const { data: videos, error } = await this.supabase
            .from('videos')
            .select('*')
            .order('created_at', { ascending: false });

          if (error) throw error;

          this.videos = videos || [];

          // Load shots for each video
          const { data: shots } = await this.supabase
            .from('shots')
            .select('*')
            .in('video_id', this.videos.map(v => v.id));

          if (shots && !shots.error) {
            this.shots = shots.reduce((acc, shot) => {
              acc[shot.video_id] = shot;
              return acc;
            }, {});
          }

        } catch (error) {
          this.error = 'Failed to load data';
          console.error('Load error:', error);
        }
      }

      async saveVideo(video) {
        try {
          const videoData = {
            title: video.title,
            views: video.views || '',
            url: video.url,
            category: video.category || null,
            updated_at: new Date().toISOString()
          };

          if (video.id) {
            // Update existing video
            const { error } = await this.supabase
              .from('videos')
              .update(videoData)
              .eq('id', video.id);

            if (error) throw error;
          } else {
            // Create new video
            const { data, error } = await this.supabase
              .from('videos')
              .insert({
                ...videoData,
                created_at: new Date().toISOString()
              })
              .select()
              .single();

            if (error) throw error;
            video.id = data.id;
          }

          await this.loadState();
          return video;
        } catch (error) {
          this.error = 'Failed to save video';
          console.error('Save error:', error);
          throw error;
        }
      }

      async deleteVideo(id) {
        try {
          const { error } = await this.supabase
            .from('videos')
            .delete()
            .eq('id', id);

          if (error) throw error;

          await this.loadState();
        } catch (error) {
          this.error = 'Failed to delete video';
          console.error('Delete error:', error);
          throw error;
        }
      }

      async saveShots(videoId, shots) {
        try {
          const { error } = await this.supabase
            .from('shots')
            .upsert({
              video_id: videoId,
              list: shots,
              count: shots.filter(s => s.trim()).length,
              updated_at: new Date().toISOString()
            });

          if (error) throw error;

          this.shots[videoId] = {
            video_id: videoId,
            list: shots,
            count: shots.filter(s => s.trim()).length
          };
        } catch (error) {
          this.error = 'Failed to save shots';
          console.error('Shots save error:', error);
          throw error;
        }
      }

      getFilteredVideos() {
        if (this.currentFilter === 'all') {
          return this.videos;
        }
        return this.videos.filter(video => video.category === this.currentFilter);
      }

      render() {
        // Update video count
        document.getElementById('videoCount').textContent = `${this.videos.length} videos`;

        // Show/hide loading and error states
        document.getElementById('loading').style.display = this.loading ? 'flex' : 'none';
        document.getElementById('error').style.display = this.error ? 'block' : 'none';

        // Render videos
        const videoGrid = document.getElementById('videoGrid');
        const filteredVideos = this.getFilteredVideos();
        
        videoGrid.innerHTML = '';
        
        if (filteredVideos.length === 0 && !this.loading) {
          videoGrid.innerHTML = '<div style="text-align: center; padding: 2rem; color: var(--gray-500);">No videos found</div>';
          return;
        }

        filteredVideos.forEach(video => {
          const videoCard = this.createVideoCard(video);
          videoGrid.appendChild(videoCard);
        });
      }

      createVideoCard(video) {
        const card = document.createElement('div');
        card.className = 'card';
        
        const shots = this.shots[video.id] || { list: [], count: 0 };
        
        card.innerHTML = `
          <div class="video-container">
            <video preload="metadata" playsinline>
              <source src="${video.url}" type="video/mp4">
            </video>
          </div>
          <div class="card-content">
            <h3 class="card-title">${this.escapeHtml(video.title)}</h3>
            <p class="card-views">${video.views || 'No views'}</p>
            <div class="card-actions">
              <button class="btn btn-small btn-edit" onclick="app.editVideo(${video.id})">Edit</button>
              <button class="btn btn-small btn-delete" onclick="app.deleteVideo(${video.id})">Delete</button>
            </div>
            <div class="shots-section">
              <div class="shots-header">
                <span class="shots-title">Shots</span>
                <span class="shots-count">${shots.count}</span>
              </div>
              <ul class="shots-list">
                ${shots.list.map((shot, index) => `
                  <li class="shot-item">
                    <input type="text" class="shot-input" value="${this.escapeHtml(shot)}" 
                           onchange="app.updateShot(${video.id}, ${index}, this.value)"
                           placeholder="Shot description">
                    <button class="btn-remove" onclick="app.removeShot(${video.id}, ${index})">×</button>
                  </li>
                `).join('')}
                ${shots.list.length === 0 ? '<span style="color: var(--gray-500); font-size: 0.875rem;">No shots yet</span>' : ''}
              </ul>
              <button class="btn-add-shot" onclick="app.addShot(${video.id})">+ Add Shot</button>
            </div>
          </div>
        `;

        return card;
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      openModal(video = null) {
        this.currentEditId = video?.id || null;
        const modal = document.getElementById('modalOverlay');
        const title = document.getElementById('modalTitle');
        const form = document.getElementById('videoForm');
        
        title.textContent = video ? 'Edit Video' : 'Add Video';
        
        if (video) {
          document.getElementById('title').value = video.title || '';
          document.getElementById('views').value = video.views || '';
          document.getElementById('url').value = video.url || '';
          document.getElementById('category').value = video.category || '';
        } else {
          form.reset();
        }
        
        modal.classList.add('active');
      }

      closeModal() {
        const modal = document.getElementById('modalOverlay');
        modal.classList.remove('active');
        this.currentEditId = null;
      }

      async saveVideo() {
        const form = document.getElementById('videoForm');
        const formData = new FormData(form);
        
        const video = {
          id: this.currentEditId,
          title: formData.get('title')?.trim(),
          views: formData.get('views')?.trim(),
          url: formData.get('url')?.trim(),
          category: formData.get('category') || null
        };

        if (!video.title || !video.url) {
          alert('Title and URL are required');
          return;
        }

        try {
          await this.saveVideo(video);
          this.closeModal();
        } catch (error) {
          alert('Error saving video: ' + error.message);
        }
      }

      async deleteVideo(id) {
        if (!confirm('Are you sure you want to delete this video?')) {
          return;
        }

        try {
          await this.deleteVideo(id);
        } catch (error) {
          alert('Error deleting video: ' + error.message);
        }
      }

      async updateShot(videoId, shotIndex, value) {
        const shots = [...(this.shots[videoId]?.list || [])];
        shots[shotIndex] = value;
        
        try {
          await this.saveShots(videoId, shots);
        } catch (error) {
          alert('Error saving shot: ' + error.message);
        }
      }

      async addShot(videoId) {
        const shots = [...(this.shots[videoId]?.list || [])];
        shots.push('');
        
        try {
          await this.saveShots(videoId, shots);
        } catch (error) {
          alert('Error adding shot: ' + error.message);
        }
      }

      async removeShot(videoId, shotIndex) {
        const shots = [...(this.shots[videoId]?.list || [])];
        shots.splice(shotIndex, 1);
        
        try {
          await this.saveShots(videoId, shots);
        } catch (error) {
          alert('Error removing shot: ' + error.message);
        }
      }

      setFilter(category) {
        this.currentFilter = category;
        
        // Update category pills
        document.querySelectorAll('.category-pill').forEach(pill => {
          pill.classList.remove('active');
        });
        
        const activePill = document.querySelector(`[data-category="${category}"]`);
        if (activePill) {
          activePill.classList.add('active');
        }
        
        this.render();
      }
    }

    // Initialize application
    const app = new AppState();
    
    // Event listeners
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await app.initialize();
        
        // Set up event listeners
        document.getElementById('saveBtn').addEventListener('click', () => app.saveVideo());
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
          if (e.target.id === 'modalOverlay') {
            app.closeModal();
          }
        });
        
        // Create category filter pills
        const categoriesContainer = document.getElementById('categories');
        app.categories.forEach(category => {
          const pill = document.createElement('button');
          pill.className = 'category-pill';
          pill.textContent = category;
          pill.dataset.category = category;
          pill.addEventListener('click', () => app.setFilter(category));
          categoriesContainer.appendChild(pill);
        });
        
      } catch (error) {
        console.error('Initialization error:', error);
        document.getElementById('error').style.display = 'block';
        document.getElementById('loading').style.display = 'none';
      }
    });
  </script>
</body>
</html>
