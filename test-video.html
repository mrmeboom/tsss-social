<!DOCTYPE html>
<html>
<head>
    <title>Video Test</title>
    <style>
        .test-video {
            width: 300px;
            height: 400px;
            border: 2px solid red;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>Video Autoplay Test</h1>
    
    <div class="test-video" onmouseenter="document.getElementById('test1').play()" onmouseleave="document.getElementById('test1').pause()">
        <video id="test1" loop preload="metadata">
            <source src="videos/05_sherrybend.mp4" type="video/mp4">
        </video>
    </div>
    
    <div class="test-video" onmouseenter="document.getElementById('test2').play()" onmouseleave="document.getElementById('test2').pause()">
        <video id="test2" loop preload="metadata" muted>
            <source src="videos/05_sherrybend.mp4" type="video/mp4">
        </video>
    </div>
    
    <p>Red box 1: Video with audio (may not autoplay)</p>
    <p>Red box 2: Video muted (should autoplay)</p>
</body>
</html>
